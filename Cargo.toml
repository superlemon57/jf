[package]
name = "jf"
version = "0.2.0"
edition = "2021"
description = "Lightweight Jellyfin HTPC client with a Prime Video style interface and Apple TV and Android TV remote support"
repository = "https://github.com/superlemon57/jf"
license = "MIT"

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
if-addrs = "0.13"
mdns-sd = "0.13"
num-bigint = "0.4"
num-traits = "0.2"
plist = "1"
rand = "0.8"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

# RSA key generation (Android TV remote) is very slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
